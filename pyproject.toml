[project]
name = "olist-product-analytics"
version = "0.1.0"
description = "A product analytics case study on the Olist Brazilian e-commerce marketplace, in SQL (DuckDB)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
